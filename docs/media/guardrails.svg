<text class="o1" x="58.06" y="109"><tspan fill="#ff6b6b" font-weight="700">✗</tspan><tspan fill="#ffc9c9"> guardrails: stage explicit paths (git add &lt;path&gt; …), never git add -A: other sessions may have changes here.</tspan></text>
