# Slack app for the slack-channel plugin. Create it at https://api.slack.com/apps → Create New App → From a manifest,
# pick the workspace, paste this, then: Install to Workspace (bot token xoxb-…), and Basic Information → App-Level
# Tokens → Generate with the scope connections:write (app token xapp-…).
display_information:
  name: Claude Code
  description: The Claude Code session on my own computer
  background_color: "#1f2328"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Claude Code
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - reactions:write
      - files:read
      - files:write
      - channels:history
      - groups:history
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
